<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Verificação de layout</title><style>body{margin:0;background:#888;font:14px Arial}nav{display:flex;gap:12px;justify-content:center;padding:12px;position:sticky;top:0;background:#eee;z-index:1}button{padding:10px;cursor:pointer}iframe{display:block;width:390px;height:844px;margin:16px auto;border:0;background:#1a1a1a}</style><nav><button data-width="390" data-height="844">Celular 390 × 844</button><button data-width="320" data-height="667">Celular 320 × 667</button><button data-width="768" data-height="1024">Tablet 768 × 1024</button><button data-width="1366" data-height="900">Desktop 1366 × 900</button></nav><iframe id="viewport" title="Prévia responsiva da landing page" src="/"></iframe><script>document.querySelectorAll("button").forEach(b=>b.onclick=()=>{const f=document.getElementById("viewport");f.style.width=b.dataset.width+"px";f.style.height=b.dataset.height+"px";f.src="/";})</script></html>
