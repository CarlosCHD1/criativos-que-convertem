<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisão dos fundos</title><style>body{margin:0;background:#777;font:14px Arial}nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:12px;background:#eee;position:sticky;top:0;z-index:2}button{padding:10px;cursor:pointer}iframe{display:block;margin:16px auto;border:0;box-shadow:0 0 0 1px #555}</style><nav><button data-width="390" data-height="844">Celular 390 × 844</button><button data-width="320" data-height="667">Celular 320 × 667</button><button data-width="1366" data-height="900">Desktop</button><button data-anchor="inicio">Hero</button><button data-anchor="metodo">Método</button><button data-anchor="oferta">Oferta</button></nav><iframe id="viewport" title="Prévia responsiva" width="390" height="844" src="/"></iframe><script>const f=document.getElementById('viewport');document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.width){f.width=b.dataset.width;f.height=b.dataset.height}else{f.contentDocument.getElementById(b.dataset.anchor).scrollIntoView({behavior:'instant'})}});</script></html>
